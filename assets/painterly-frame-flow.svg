<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Painterly Frame visual workflow</title>
  <desc id="desc">A six-step workflow from source image analysis to a finished painterly frame.</desc>
  <rect width="1800" height="760" fill="#ffffff"/>
  <style>
    .eyebrow { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; fill: #6c7788; }
    .title { font: 600 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #142033; }
    .sub { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6c7788; }
    .nodeTitle { font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #142033; }
    .nodeSub { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #687588; }
    .step { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #ffffff; }
    .foot { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536176; }
  </style>

  <text x="100" y="82" class="eyebrow">PAINTERLY FRAME / VISUAL LOGIC</text>
  <text x="100" y="138" class="title">From source image to authored painted frame</text>
  <text x="100" y="176" class="sub">Preserve recognition anchors. Transform attention, colour, shape and material.</text>

  <line x1="154" y1="376" x2="1646" y2="376" stroke="#d9e0e9" stroke-width="3"/>

  <g transform="translate(80 270)">
    <circle cx="74" cy="30" r="24" fill="#4b6cf6"/><text x="74" y="36" text-anchor="middle" class="step">01</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#f7f9fc" stroke="#d9e0e9" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle">Source Image</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub">观察输入图</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub">主体 · 位置 · 光线</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub">空间 · 色彩 · 纹理</text>
  </g>

  <g transform="translate(360 270)">
    <circle cx="74" cy="30" r="24" fill="#4b6cf6"/><text x="74" y="36" text-anchor="middle" class="step">02</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#f7f9fc" stroke="#d9e0e9" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle">Source Card</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub">识别锚点</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub">保留项 / 可变项</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub">抽象程度 · 曝光</text>
  </g>

  <g transform="translate(640 270)">
    <circle cx="74" cy="30" r="24" fill="#e3a54a"/><text x="74" y="36" text-anchor="middle" class="step">03</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#fffaf2" stroke="#ecd9b6" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle">Directorial Pass</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub">视觉主体与压力</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub">主宏观变化</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub">前景 · 负空间 · 光形</text>
  </g>

  <g transform="translate(920 270)">
    <circle cx="74" cy="30" r="24" fill="#e3a54a"/><text x="74" y="36" text-anchor="middle" class="step">04</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#fffaf2" stroke="#ecd9b6" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle">Colour + Contrast</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub">主色场与结构色</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub">焦点对比预算</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub">背景的有色退让</text>
  </g>

  <g transform="translate(1200 270)">
    <circle cx="74" cy="30" r="24" fill="#4b6cf6"/><text x="74" y="36" text-anchor="middle" class="step">05</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#f7f9fc" stroke="#d9e0e9" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle">Painterly Rebuild</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub">大色面与分面</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub">材质笔触</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub">边缘层级 · 图形标记</text>
  </g>

  <g transform="translate(1480 270)">
    <circle cx="74" cy="30" r="24" fill="#142033"/><text x="74" y="36" text-anchor="middle" class="step">06</text>
    <rect x="0" y="74" width="190" height="174" rx="18" fill="#142033"/>
    <text x="95" y="122" text-anchor="middle" class="nodeTitle" style="fill:#ffffff">Quality Gate</text>
    <text x="95" y="154" text-anchor="middle" class="nodeSub" style="fill:#d9e0e9">缩略图读取</text>
    <text x="95" y="184" text-anchor="middle" class="nodeSub" style="fill:#d9e0e9">中景关系 · 近景材质</text>
    <text x="95" y="208" text-anchor="middle" class="nodeSub" style="fill:#d9e0e9">完成最终画面</text>
  </g>

  <g fill="none" stroke="#aab6c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 388 H340"/><path d="M550 388 H620"/><path d="M830 388 H900"/><path d="M1110 388 H1180"/><path d="M1390 388 H1460"/>
  </g>
  <g fill="#aab6c7">
    <path d="M340 388 l-12 -8 v16 z"/><path d="M620 388 l-12 -8 v16 z"/><path d="M900 388 l-12 -8 v16 z"/><path d="M1180 388 l-12 -8 v16 z"/><path d="M1460 388 l-12 -8 v16 z"/>
  </g>

  <line x1="100" y1="646" x2="1700" y2="646" stroke="#e7ebf1" stroke-width="2"/>
  <text x="100" y="690" class="foot">The output is recognisable at a glance, but its attention geometry, colour balance and painted surface are deliberately authored.</text>
</svg>
